<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <!-- menu desplegable -->
        <div calss="container-fluid">
            <div class="row">
                <div class="col">
                    <nav class="navbar navbar-expand-lg navbar-dark"  style="background-color: rgba(0, 0, 163, 0.89);">
                        <div class="container-fluid">
                             <a class="navbar-brand" href="#">
                                        <img src="imagenes/logo.png" alt="Logo" style="width:40px;" class="rounded-pill">
                            </a>
                            <button class="navbar-toggler" type="button"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#menu"
                                    aria-controls="menu"
                                    aria-expanded="false"
                                    aria-label="Abrir menú">
                                <span class="navbar-toggler-icon"></span>
                            </button>

                            <div class="collapse navbar-collapse" id="menu">
                               
                                <ul class="navbar-nav mb-2">
                                    <li class="nav-item">
                                        <a class="nav-link" href="#descripcion">Inicio</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#videojuegos">Servicios</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#premios">Tiendas</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#ubicacion">Como funciona</a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
        <!-- imagen e informacion-->
        <div class="container-fluid my-2">
            <div class="row">
                <div class ="col-12 col-xl-6">
                      <img src="imagenes/traigo.png" class="rounded-3 mx-auto d-block img-fluid w-75" alt="traigoya" > 
                </div>
                <div class="col-12 col-xl-6" >
                    <h1 class="text-center"> Pidanos lo que busca </h1>
                    <p class="text-center">Traemos tus compras desde Nueva York hasta Ecuador. Rápido, seguro y confiable.</p>
                    <div class="d-grid">
                    <button type="button" class="btn btn-warning">Compre Ahora</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Carousel -->
         <div class="container-fluid my-3">
            <div id="demo" class="carousel slide" data-bs-ride="carousel">

            <!-- Indicators/dots -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
            </div>
            
            <!-- The slideshow/carousel -->
            <div class="carousel-inner">
                <div class="carousel-item active">
                <img src="imagenes/pedidos1.jpg" alt="Los Angeles" class="d-block" style="width:100%">
                <div class="carousel-caption">
                    <h3>Los Angeles</h3>
                    <p>We had such a great time in LA!</p>
                </div>
                </div>
                <div class="carousel-item">
                <img src="imagenes/pedidos2.png" alt="Chicago" class="d-block" style="width:100%">
                <div class="carousel-caption">
                    <h3>Chicago</h3>
                    <p>Thank you, Chicago!</p>
                </div> 
                </div>
                <div class="carousel-item">
                <img src="imagenes/entrega.jpg" alt="New York" class="d-block" style="width:100%">
                <div class="carousel-caption">
                    <h3>New York</h3>
                    <p>We love the Big Apple!</p>
                </div>  
                </div>
            </div>
            
            <!-- Left and right controls/icons -->
            <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
            </div>
         </div>
            
    </header>
    
</body>
</html>
